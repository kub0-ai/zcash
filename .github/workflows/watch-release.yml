name: Watch Upstream Release

# EOL FAIL-CLOSED (2026-07-30): zcashd 6.20.0 is past EOS halt (height 3417100, 2026-07-18).
# This workflow must NOT auto-bump VERSION or git push origin HEAD:main.
# See DEPRECATION.md / README.md — migrate to Zebra / Zallet.

on:
  # No schedule. zcashd is end-of-support, so there is no upstream release worth
  # watching, and this job's only action is to print the banner below and exit 1.
  # On a daily cron that meant one red run per day carrying zero signal, which
  # only trains operators to ignore this repo's status. DEPRECATION.md already
  # documents the schedule as disabled; this makes the workflow match the doc.
  #
  # The publish gate is build.yml's eol-gate job, which is unchanged and still
  # fails closed on every push to main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: EOL — refuse unattended release chain
        run: |
          set -euo pipefail
          cat <<'EOF'
          ============================================================
          EOL / DO NOT DEPLOY — watch-release is fail-closed
          ============================================================
          kub0-ai/zcash packages zcashd only. Upstream End-of-Support
          halt for 6.20.0 was height 3417100 (2026-07-18). Unmodified
          zcashd will not run on current mainnet.

          Auto-bump of VERSION → push main → GHCR :latest is DISABLED.
          Migrate operators to Zebra (zebrad) and Zallet.

          Docs: DEPRECATION.md, README.md
          Audit: agent-memory/audit/zcash/, agent-memory/audit/upstream-zcash/
          ============================================================
          EOF
          exit 1
